<ellipse cx="34" cy="371" rx="20" ry="51" transform="rotate(-34 34 371)"/><ellipse cx="128" cy="334" rx="19" ry="47" transform="rotate(39 128 334)"/>
<ellipse cx="69" cy="320" rx="18" ry="47" transform="rotate(-7 69 320)"/><ellipse cx="617" cy="387" rx="18" ry="49" transform="rotate(-28 617 387)"/>
<ellipse cx="702" cy="331" rx="15" ry="40" transform="rotate(35 702 331)"/>
</g>
<ellipse cx="361" cy="643" rx="275" ry="36" fill="#a66d70" opacity=".2" filter="url(#shadow)"/>

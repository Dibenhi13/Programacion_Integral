  <text x="263" y="464" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle" fill="#896e69">BLOOM</text>
  <text x="263" y="482" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle" fill="#896e69">CLEANSER</text>
  <text x="263" y="510" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#a18b85">150 ml / 5.0 fl oz</text>
</g>
<!-- tall dropper bottle right -->
<g filter="url(#soft)">
  <rect x="376" y="332" width="151" height="254" rx="31" fill="url(#serum)"/>
  <rect x="406" y="260" width="92" height="93" rx="15" fill="url(#cap)"/>
  <rect x="434" y="210" width="35" height="68" rx="13" fill="#fff9ef"/>
  <ellipse cx="452" cy="211" rx="17" ry="22" fill="#f4eae2"/>
  <rect x="387" y="419" width="128" height="111" rx="2" fill="#fffcf6" opacity=".8"/>
  <text x="451" y="449" font-family="Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="-1.4" text-anchor="middle" fill="#53403f">bloom.skin</text>
  <path d="M413 468H488" stroke="#d3a4a3" stroke-width="1"/>
  <text x="451" y="486" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle" fill="#896e69">DEW DROPS</text>
  <text x="451" y="512" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#a18b85">hydrating serum</text>
</g>
<!-- cream jar at front -->
<g filter="url(#soft)">
  <rect x="297" y="525" width="189" height="100" rx="21" fill="url(#jar)"/>
  <rect x="289" y="505" width="205" height="45" rx="11" fill="url(#cap)"/>

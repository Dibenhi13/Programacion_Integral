<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-label="Colección Bloom Skin">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e4e1"/><stop offset="1" stop-color="#dfb5b7"/></linearGradient>
  <linearGradient id="jar" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#fffaf5"/><stop offset=".55" stop-color="#eadbd0"/><stop offset="1" stop-color="#c2aea7"/></linearGradient>
  <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dbc1b3"/><stop offset=".3" stop-color="#fffaf1"/><stop offset=".68" stop-color="#f8ece4"/><stop offset="1" stop-color="#cab4a9"/></linearGradient>
  <linearGradient id="serum" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#fdf7ed"/><stop offset=".55" stop-color="#dbc5b9"/><stop offset="1" stop-color="#bba69e"/></linearGradient>
  <linearGradient id="cap" x1="0" x2="1"><stop stop-color="#e3cdc6"/><stop offset=".5" stop-color="#fffaf1"/><stop offset="1" stop-color="#b69e99"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="5" dy="13" stdDeviation="11" flood-color="#77575b" flood-opacity=".18"/></filter>
</defs>
<rect width="720" height="760" fill="url(#bg)"/>
<circle cx="365" cy="325" r="265" fill="#fff9f1" opacity=".45"/>
<circle cx="365" cy="325" r="218" fill="#fff9f3" opacity=".4"/>

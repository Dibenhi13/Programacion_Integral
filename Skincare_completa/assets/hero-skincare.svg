<g opacity=".54" fill="none" stroke="#8e9a7f" stroke-width="6" stroke-linecap="round">
 <path d="M110 590Q36 480 70 305"/><path d="M64 440Q8 408 24 349"/><path d="M80 388Q145 345 145 298"/>
 <path d="M610 604Q710 490 675 316"/><path d="M666 437Q612 416 601 364"/><path d="M677 371Q719 341 711 300"/>
</g>

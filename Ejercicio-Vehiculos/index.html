
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Arrendamiento de Vehículos</title>
</head>
<body>
    <h1>Arrendamiento de Vehículos</h1>

    <h2>Vehículos disponibles</h2>
    <div id="vehiculos"></div>

    <h2>Rentar un vehículo</h2>

    <label>Selecciona un vehículo:</label>
    <select id="seleccion"></select>

    <p>Días de renta:</p>
    <input type="number" id="dias" min="1" value="1">

    <button onclick="rentarVehiculo()">Rentar vehículo</button>

    <h3 id="resultado"></h3>

    <script src="script.js"></script>
</body>
</html>
